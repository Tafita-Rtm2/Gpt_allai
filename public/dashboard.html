<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RTM AI Proxy</title>
    <link rel="stylesheet" href="dashboard.style.css">
    <link href="httpshttps://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>RTM AI Proxy</h1>
            <div>
                <span id="user-email"></span>
                <button id="logout-button">Logout</button>
            </div>
        </header>

        <main class="dashboard-main">
            <section class="card api-generator">
                <h2><i class="bi bi-key-fill"></i> Generate New API Key</h2>
                <div class="generation-form">
                    <div class="form-group">
                        <label for="provider-dropdown">Select a Provider</label>
                        <div class="provider-select-container">
                            <select id="provider-dropdown">
                                <option value="" selected>-- Please choose --</option>
                                <option value="claude">Claude</option>
                                <option value="gemini">Gemini</option>
                                <option value="openai">OpenAI</option>
                                <option value="puter">Puter</option>
                            </select>
                            <img id="provider-logo" src="" alt="Provider Logo" class="provider-logo hidden">
                        </div>
                    </div>
                    <div id="puter-filter-section" class="hidden form-group">
                        <label for="puter-search">Optional: Filter Puter Models</label>
                        <input type="search" id="puter-search" placeholder="Search for a model family...">
                        <div id="puter-families-list"></div>
                    </div>
                    <button id="generate-key-button" disabled>Generate Key</button>
                </div>
                <div id="api-key-display" class="hidden">
                    <h3>Your New Key:</h3>
                    <div class="key-box">
                        <code id="api-key-code"></code>
                        <button id="copy-key-button"><i class="bi bi-clipboard"></i></button>
                    </div>
                </div>
            </section>

            <section class="card api-key-history">
                <h2><i class="bi bi-clock-history"></i> API Key History</h2>
                <div id="api-key-history-container">
                    <p>Loading API keys...</p>
                    <!-- API key history will be injected here -->
                </div>
            </section>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
