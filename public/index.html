<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - RTM AI Proxy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form-wrapper" id="login-form-wrapper">
            <header>
                <h1>Welcome Back!</h1>
                <p>Log in to access your dashboard.</p>
            </header>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn-primary">Log In</button>
                <p class="message" id="login-message"></p>
            </form>
            <p class="toggle-link">
                Don't have an account? <a href="#" id="show-register">Sign up</a>
            </p>
        </div>

        <div class="auth-form-wrapper hidden" id="register-form-wrapper">
            <header>
                <h1>Create Account</h1>
                <p>Get started by creating a new account.</p>
            </header>
            <form id="register-form">
                <div class="input-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="input-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit" class="btn-primary">Sign Up</button>
                <p class="message" id="register-message"></p>
            </form>
            <p class="toggle-link">
                Already have an account? <a href="#" id="show-login">Log in</a>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
