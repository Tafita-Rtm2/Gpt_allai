<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTM AI Proxy - API Key Generation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to the RTM AI Proxy</h1>
            <p class="description">
                Select a provider to generate a tailored API key for your application.
            </p>
        </header>

        <main id="main-content">
            <div class="generation-form">
                <section id="provider-selection">
                    <h2>1. Select a Provider</h2>
                    <select id="provider-dropdown">
                        <option value="" selected>-- Please choose a provider --</option>
                        <option value="claude">Claude</option>
                        <option value="gemini">Gemini</option>
                        <option value="openai_gpt">OpenAI / GPT</option>
                        <option value="puter">Puter (includes Grok, Deepseek, etc.)</option>
                    </select>
                </section>

                <section id="puter-filter-section" class="hidden">
                    <h3>Optional: Filter Puter Models by Family</h3>
                    <input type="search" id="puter-search" placeholder="Search for a model family (e.g., grok)...">
                    <div id="puter-families-list">
                        <!-- This will be populated dynamically -->
                    </div>
                </section>

                <section id="key-generation">
                    <h2>2. Generate Your API Key</h2>
                    <button id="start-button" disabled>Get Your API Key</button>
                </section>
            </div>
        </main>

        <section id="api-key-section" class="hidden">
            <h2>Your New API Key</h2>
            <div class="api-key-display">
                <code id="api-key-code"></code>
                <button id="copy-button">Copy</button>
            </div>
            <p class="note">This key is safe to share. It combines your selection with a backend key.</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
