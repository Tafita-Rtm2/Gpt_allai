<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - RTM AI Proxy</title>
    <link rel="stylesheet" href="auth-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-wrapper">
            <!-- Login Form -->
            <div class="auth-form-wrapper" id="login-form-wrapper">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your credentials to access your account.</p>
                </div>
                <form id="login-form" class="form-body">
                    <div class="input-group">
                        <input type="email" id="login-email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="login-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="auth-button">Login</button>
                    <p class="message" id="login-message"></p>
                </form>
                <div class="form-footer">
                    <p>Don't have an account? <a href="#" id="show-register">Sign Up</a></p>
                </div>
            </div>

            <!-- Registration Form -->
            <div class="auth-form-wrapper hidden" id="register-form-wrapper">
                <div class="form-header">
                    <h2>Create Account</h2>
                    <p>Join us and get access to the best AI models.</p>
                </div>
                <form id="register-form" class="form-body">
                    <div class="input-group">
                        <input type="email" id="register-email" placeholder="Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="register-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="auth-button">Sign Up</button>
                    <p class="message" id="register-message"></p>
                </form>
                <div class="form-footer">
                    <p>Already have an account? <a href="#" id="show-login">Login</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
