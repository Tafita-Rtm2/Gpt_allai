<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RTM Auth</title>
  <link rel="stylesheet" href="new-style.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
  <div class="auth-container">
    <!-- LOGIN -->
   <div class="auth-box active" id="login-box">
  <div class="fluid-bg"></div>
  <style>
    .fluid-bg {
      position: absolute;
      top: -150px;
      left: -50px;
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, #ff00cc, #3333ff, #00f7ff);
      background-size: 400% 400%;
      border-radius: 40% 60% 70% 30% / 30% 40% 60% 70%;
      animation: fluidMove 8s ease-in-out infinite, gradientShift 10s ease infinite;
      z-index: -1;
      filter: blur(40px);
    }
    @keyframes fluidMove {
      0% { border-radius: 40% 60% 70% 30% / 30% 40% 60% 70%; }
      50% { border-radius: 70% 30% 40% 60% / 60% 70% 30% 40%; }
      100% { border-radius: 40% 60% 70% 30% / 30% 40% 60% 70%; }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>

  <h1>Welcome Back</h1>
  <form>

        <div class="input-group">
          <i class="bi bi-envelope-fill"></i>
          <input type="email" placeholder="Email Address" required/>
        </div>
        <div class="input-group">
          <i class="bi bi-lock-fill"></i>
          <input type="password" placeholder="Password" required/>
          <i class="bi bi-eye-slash toggle-pass"></i>
        </div>
        <a href="#" class="forgot">Forgot Password?</a>
        <button type="submit" class="btn"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
      </form>
      <p class="switch">Don’t have an account? <a href="#" id="go-signup">Sign up</a></p>
    </div>

    <!-- SIGNUP -->
    <div class="auth-box" id="signup-box">
      <div class="circle"></div>
      <h1>Sign up</h1>
      <form>
        <div class="input-group">
          <i class="bi bi-envelope-fill"></i>
          <input type="email" placeholder="Email Address" required/>
        </div>
        <div class="input-group">
          <i class="bi bi-lock-fill"></i>
          <input type="password" placeholder="Password" required/>
          <i class="bi bi-eye-slash toggle-pass"></i>
        </div>
        <button type="submit" class="btn"><i class="bi bi-person-plus-fill"></i> Create Account</button>
      </form>
      <p class="switch">Already have an account? <a href="#" id="go-login">Log in</a></p>
    </div>
  </div>

  <!-- SCRIPT INLINE -->
  <script>
    const loginBox = document.getElementById("login-box");
    const signupBox = document.getElementById("signup-box");

    document.getElementById("go-signup").addEventListener("click", (e) => {
      e.preventDefault();
      loginBox.classList.remove("active");
      signupBox.classList.add("active");
    });

    document.getElementById("go-login").addEventListener("click", (e) => {
      e.preventDefault();
      signupBox.classList.remove("active");
      loginBox.classList.add("active");
    });

    // toggle password visibility
    document.querySelectorAll(".toggle-pass").forEach(icon => {
      icon.addEventListener("click", () => {
        let input = icon.previousElementSibling;
        if (input.type === "password") {
          input.type = "text";
          icon.classList.replace("bi-eye-slash", "bi-eye");
        } else {
          input.type = "password";
          icon.classList.replace("bi-eye", "bi-eye-slash");
        }
      });
    });
  </script>

  <!-- Référence gardée -->
  <script src="script.js"></script>
</body>
</html>
